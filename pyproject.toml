[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dssatlab"
version = "0.2.0"
description = "A small Python interface to DSSAT-CSM: find or build DSSAT, then run a FileX."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
keywords = ["DSSAT", "crop-model", "agriculture", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "twine>=6"]

[project.urls]
Source = "https://github.com/AbdelrahmanAmr3/dssatlab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
