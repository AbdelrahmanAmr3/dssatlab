[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dssatlab"
version = "0.1.0.dev0"
description = "Python integration for DSSAT-CSM (under development)."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = []

[project.urls]
Source = "https://github.com/AbdelrahmanAmr3/dssatlab"

[tool.setuptools.packages.find]
where = ["src"]
