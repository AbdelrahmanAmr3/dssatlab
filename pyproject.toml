[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dssatlab"
version = "0.1.0"
description = "Basic environment diagnostics for DSSATLab users."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "twine>=6"]

[project.urls]
Source = "https://github.com/AbdelrahmanAmr3/dssatlab"

[tool.setuptools.packages.find]
where = ["src"]
