[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dssatlab"
version = "0.6.0"
description = "A small Python interface to DSSAT-CSM: find or build DSSAT, run a FileX, or run a simulation from your own weather data."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
keywords = ["DSSAT", "crop-model", "agriculture", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "twine>=6", "pyyaml>=6", "matplotlib>=3.8"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-include-markdown-plugin>=7"]
plot = ["matplotlib>=3.8"]
yaml = ["pyyaml>=6"]

[project.urls]
Source = "https://github.com/AbdelrahmanAmr3/dssatlab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
