name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package to PyPI after checks pass
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm release version
        if: github.event_name == 'release' || inputs.publish
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if ".dev" in version:
              raise SystemExit(
                  f"Package version {version} is a development scaffold. "
                  "Prepare a functional release and set its version before publishing."
              )
          if os.environ["GITHUB_EVENT_NAME"] == "release" and version != tag.removeprefix("v"):
              raise SystemExit(
                  f"Release tag {tag!r} does not match package version {version!r}. "
                  f"Create the release from a tag named v{version}."
              )
          PY
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish:
    if: github.event_name == 'release' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
