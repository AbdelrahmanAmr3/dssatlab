site_name: DSSATLab
site_description: Run the DSSAT crop model from Python, starting from your own weather data.
site_url: https://abdelrahmanamr3.github.io/dssatlab/
repo_url: https://github.com/AbdelrahmanAmr3/dssatlab
repo_name: AbdelrahmanAmr3/dssatlab

# Agent-facing folders must never be published, even if present.
exclude_docs: |
  agents/
  Diagrams/

theme:
  name: material

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

# Only the pages listed here are published. Specs and agent files are never listed.
nav:
  - Home: index.md
  - Guide:
      - guide/index.md
      - Install and connect: guide/install.md
      - Run a FileX: guide/run-filex.md
      - Run a Simulation: guide/simulation.md
      - Run with soil data: guide/soil.md
      - Run with management data: guide/management.md
      - Run with experiment data: guide/experiment.md
      - Run treatments and scenarios: guide/scenarios.md
      - Seasonal analysis: guide/seasonal.md
      - Sequence analysis: guide/sequence.md
      - Reading results: guide/reading-results.md
      - Evaluate against observed data: guide/evaluate.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference and Architecture:
      - reference/index.md
      - API reference: reference/api.md
      - Architecture: reference/architecture.md
      - Glossary: reference/glossary.md
      - Decisions:
          - reference/decisions.md
          - adr/0001-short-managed-install-prefix.md
          - adr/0002-optional-pandas.md
          - adr/0003-optional-pyyaml-for-management.md
          - adr/0004-optional-matplotlib-for-plots.md
          - adr/0005-experiment-data-edits-an-existing-filex.md
          - adr/0006-filex-written-from-a-fixed-template.md
          - adr/0007-evaluation-computed-in-python.md
          - adr/0008-read-filea-filet-and-evaluate-out.md
          - adr/0009-ten-template-crops-and-listing.md
          - adr/0010-template-treatments-named-in-template-varied-by-experiment-data.md
          - adr/0011-template-fields-numbered-per-treatment-data-keyed-by-field.md
          - adr/0012-seasons-through-nyers-no-batch-mode.md
          - adr/0013-sequences-run-in-mode-q-through-a-batch-file.md
          - adr/0014-rotation-in-the-filex-template.md
      - Testing and CI: reference/testing-ci.md
      - Releasing: reference/releasing.md
      - Roadmap: reference/roadmap.md
  - Changelog: changelog.md
